line-length = 90
target-version = "py312"

[lint]
select = [
    "E", "W",
    "F",
    "I",
    "UP",
    "B",
    "T10",
    "T20",
    "RUF",
]
ignore = [
    "E501",
]

[lint.per-file-ignores]
"**/tests/**" = ["T20"]
"**/scripts/**" = ["T20"]

# harness/.ruff.toml and tests/harness/.ruff.toml extend this file, so a project's own ruff run
# lints harness code with these rules. Name the packages, because ruff would otherwise guess
# them from the folder of the closest config.
[lint.isort]
known-first-party = ["harness", "tests"]
