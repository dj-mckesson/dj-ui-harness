[project]
name = "pricewave-harness"
version = "0.1.0"
description = "Python tooling for the Pricewave coding harness. The app itself is Next.js."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pydantic>=2.13.4",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/harness"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
